<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power BI TV</title>
<style>
  :root {
    --fade: 900ms;
    --accent: #f2c811;
    --chip-bg: rgba(20, 20, 24, 0.72);
    --chip-fg: #fff;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  body.nocursor, body.nocursor * { cursor: none !important; }

  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  #stage iframe {
    position: absolute; left: 0; width: 100%;
    border: 0; opacity: 0; z-index: 0;
    transition: opacity var(--fade) ease;
  }
  #stage iframe.on { opacity: 1; z-index: 1; }

  #shield { position: fixed; inset: 0; z-index: 5; }

  .chip {
    position: fixed; z-index: 10; pointer-events: none;
    background: var(--chip-bg); color: var(--chip-fg);
    border-radius: 0.5em; padding: 0.35em 0.75em;
    font-size: clamp(14px, 1.15vw, 30px); line-height: 1.3;
    backdrop-filter: blur(4px);
    transition: opacity 600ms ease;
  }
  .chip.hide { opacity: 0; }
  #title { top: 1.2vh; left: 1vw; }
  #title b { color: var(--accent); font-weight: 600; margin-right: 0.4em; }
  #clock { top: 1.2vh; right: 1vw; font-variant-numeric: tabular-nums; }
  #status { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(18px, 2vw, 48px); }
  #hint { bottom: 3vh; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  #hint kbd {
    font-family: inherit; border: 1px solid rgba(255,255,255,.4);
    border-radius: 0.3em; padding: 0 0.35em; margin: 0 0.15em;
  }

  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 4px; z-index: 10;
    background: var(--accent); transform-origin: left center; transform: scaleX(0);
    pointer-events: none; opacity: 0.85;
  }

  #setup {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: #111; overflow: auto;
  }
  #setup .card { max-width: 760px; line-height: 1.55; font-size: 17px; }
  #setup h1 { color: var(--accent); font-weight: 600; margin-top: 0; }
  #setup code { background: #222; padding: 0.1em 0.35em; border-radius: 4px; word-break: break-all; }
  #setup .err { color: #ff8a80; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="shield"></div>
  <div id="title" class="chip hide"></div>
  <div id="clock" class="chip"></div>
  <div id="status" class="chip hide"></div>
  <div id="hint" class="chip hide">
    <kbd>←</kbd><kbd>→</kbd> cambiar página · <kbd>1</kbd>–<kbd>9</kbd> ir a página ·
    <kbd>Espacio</kbd> pausa · <kbd>R</kbd> recargar · <kbd>F</kbd> pantalla completa · <kbd>H</kbd> ayuda
  </div>
  <div id="bar"></div>
  <div id="setup"><div class="card" id="setupCard"></div></div>

<script>
(function () {
  "use strict";

  // ---------- Carga de la configuración (?config=otro.js para varias TVs) ----------
  const query = new URLSearchParams(location.search);
  const cfgFile = query.get("config") || "config.js";
  if (!/^[\w.-]+\.js$/.test(cfgFile)) {
    return showSetup("El parámetro <code>config</code> solo admite un nombre de archivo .js de esta misma carpeta.");
  }
  const tag = document.createElement("script");
  tag.src = cfgFile;
  tag.onload = start;
  tag.onerror = () => showSetup("No se pudo cargar <code>" + cfgFile + "</code>.");
  document.head.appendChild(tag);

  function showSetup(error) {
    const box = document.getElementById("setup");
    document.getElementById("setupCard").innerHTML =
      "<h1>Power BI en TV</h1>" +
      (error ? '<p class="err">' + error + "</p>" : "") +
      "<p>Abre <code>config.js</code> y rellena:</p>" +
      "<ol>" +
      "<li><b>reportUrl</b>: el enlace de «Publicar en la web» (<code>https://app.powerbi.com/view?r=…</code>) " +
      "o el de «Insertar informe › Sitio web o portal» (<code>https://app.powerbi.com/reportEmbed?reportId=…</code>).</li>" +
      "<li><b>pages</b>: la lista de páginas a rotar. El <code>pageName</code> de cada una es el último tramo de la URL " +
      "al abrir esa página en app.powerbi.com.</li>" +
      "</ol><p>Guarda el archivo y recarga esta página.</p>";
    box.style.display = "flex";
  }

  // ---------- Motor del carrusel ----------
  function start() {
    const C = Object.assign({
      reportUrl: "", pages: [], defaultSeconds: 60, preloadSeconds: 20, transitionMs: 900,
      extraParams: {}, cropTopPx: 0, cropBottomPx: 0,
      showProgressBar: true, showPageTitle: true, showClock: true, showDate: true,
      interactive: false, reloadEveryHours: 6,
    }, window.PBI_TV_CONFIG || {});

    let pages = (C.pages || []).filter(p => p && (p.url || C.reportUrl));
    if (!pages.length && C.reportUrl) pages = [{}];            // solo la página por defecto
    if (!pages.length) return showSetup();

    const $ = id => document.getElementById(id);
    const stage = $("stage"), bar = $("bar"), titleEl = $("title"), statusEl = $("status"),
          clockEl = $("clock"), hintEl = $("hint"), shield = $("shield");
    const n = pages.length;
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    document.documentElement.style.setProperty("--fade", C.transitionMs + "ms");
    if (!C.showProgressBar) bar.style.display = "none";
    if (!C.showClock) clockEl.style.display = "none";
    if (C.interactive) shield.style.display = "none";

    // Dos iframes: uno visible y otro donde se precarga la siguiente página.
    let gen = 0;
    const frames = [0, 1].map(() => {
      const f = document.createElement("iframe");
      f.setAttribute("allowfullscreen", "");
      f.style.top = -C.cropTopPx + "px";
      f.style.height = "calc(100% + " + (C.cropTopPx + C.cropBottomPx) + "px)";
      f.gen = 0;
      stage.appendChild(f);
      return f;
    });

    function buildUrl(p) {
      if (p.url) return p.url;
      let u = C.reportUrl.trim()
        .replace(/([?&])pageName=[^&#]*&?/, "$1")
        .replace(/[?&]$/, "");
      const add = Object.assign({}, C.extraParams);
      if (p.pageName) add.pageName = p.pageName;
      for (const k of Object.keys(add)) {
        if (new RegExp("[?&]" + k + "=", "i").test(u)) continue;   // respeta lo que ya traiga la URL
        u += (u.includes("?") ? "&" : "?") + encodeURIComponent(k) + "=" + encodeURIComponent(add[k]);
      }
      return u;
    }

    // Estado
    let cur = 0;                 // iframe visible
    let idx = 0;                 // página visible
    let preparedIdx = null;      // página cargada (o cargándose) en el iframe oculto
    let slideStart = 0, slideDur = 0;
    let paused = false, pausedAt = 0;
    let switching = false, navToken = 0, pendingTarget = null;
    let reloadDue = false;

    // Retomar en la página donde se quedó tras una recarga automática.
    const m = /p=(\d+)/.exec(location.hash);
    if (m && +m[1] < n) idx = +m[1];

    function prepare(i) {
      const f = frames[1 - cur];
      f.gen = ++gen;
      preparedIdx = i;
      return new Promise(res => {
        const t = setTimeout(res, 25000);
        f.onload = () => { clearTimeout(t); res(); };
        f.src = buildUrl(pages[i]);
      });
    }

    function swap(i) {
      if (reloadDue) {
        try { history.replaceState(null, "", "#p=" + i); } catch (e) {}
        location.reload();
        return;
      }
      const old = frames[cur];
      cur = 1 - cur;
      frames[cur].classList.add("on");
      old.classList.remove("on");
      const g = old.gen;
      setTimeout(() => {               // libera memoria del iframe saliente
        if (old.gen === g && !old.classList.contains("on")) old.src = "about:blank";
      }, C.transitionMs + 200);
      idx = i;
      preparedIdx = null;
      beginSlide();
    }

    function pageLabel(i) {
      const p = pages[i];
      return (n > 1 ? "<b>" + (i + 1) + "/" + n + "</b>" : "") + escapeHtml(p.title || (n > 1 ? "Página " + (i + 1) : ""));
    }

    let titleTimer;
    function flashTitle(i, extra) {
      if (!C.showPageTitle) return;
      const html = pageLabel(i) + (extra ? " · " + extra : "");
      if (!html) return;
      titleEl.innerHTML = html;
      titleEl.classList.remove("hide");
      clearTimeout(titleTimer);
      if (!extra) titleTimer = setTimeout(() => titleEl.classList.add("hide"), 6000);
    }

    function beginSlide() {
      slideStart = performance.now();
      slideDur = Math.max(5, pages[idx].seconds || C.defaultSeconds) * 1000;
      if (paused) pausedAt = slideStart;
      flashTitle(idx);
      try { history.replaceState(null, "", "#p=" + idx); } catch (e) {}
    }

    function tick() {
      if (paused || switching) return;
      const el = performance.now() - slideStart;
      const rem = slideDur - el;
      bar.style.transform = "scaleX(" + Math.min(1, el / slideDur) + ")";
      const next = (idx + 1) % n;
      if (preparedIdx === null && rem <= C.preloadSeconds * 1000) prepare(next);
      if (rem <= 0 && preparedIdx === next) swap(next);
    }

    async function goTo(target) {
      target = ((target % n) + n) % n;
      const my = ++navToken;
      pendingTarget = target;
      switching = true;
      flashTitle(target, "cargando…");
      await prepare(target);
      if (my !== navToken) return;
      await sleep(1500);               // margen para que Power BI dibuje los visuales
      if (my !== navToken) return;
      pendingTarget = null;
      switching = false;
      swap(target);
    }
    const step = d => goTo((pendingTarget !== null ? pendingTarget : idx) + d);

    let statusTimer;
    function flashStatus(text, sticky) {
      statusEl.textContent = text;
      statusEl.classList.remove("hide");
      clearTimeout(statusTimer);
      if (!sticky) statusTimer = setTimeout(() => statusEl.classList.add("hide"), 1500);
    }

    function togglePause() {
      if (paused) {
        slideStart += performance.now() - pausedAt;
        paused = false;
        flashStatus("▶ Reanudado");
      } else {
        paused = true;
        pausedAt = performance.now();
        flashStatus("⏸ En pausa", true);
      }
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else document.documentElement.requestFullscreen().catch(() => {});
    }

    let hintTimer;
    function flashHint(ms) {
      hintEl.classList.remove("hide");
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hintEl.classList.add("hide"), ms || 8000);
    }

    // Teclado y mando de la TV
    document.addEventListener("keydown", e => {
      const k = e.key;
      if (k === "ArrowRight" || k === "PageDown" || k === "MediaTrackNext") step(1);
      else if (k === "ArrowLeft" || k === "PageUp" || k === "MediaTrackPrevious") step(-1);
      else if (k === " " || k === "Enter" || k === "MediaPlayPause" || k === "p" || k === "P") togglePause();
      else if (k === "f" || k === "F") toggleFullscreen();
      else if (k === "h" || k === "H" || k === "?") flashHint();
      else if (k === "r" || k === "R") goTo(idx);
      else if (/^[1-9]$/.test(k) && +k <= n) goTo(+k - 1);
      else return;
      e.preventDefault();
    });
    shield.addEventListener("click", toggleFullscreen);

    // Ocultar el cursor tras 3 s sin moverlo
    let cursorTimer;
    const wakeCursor = () => {
      document.body.classList.remove("nocursor");
      clearTimeout(cursorTimer);
      cursorTimer = setTimeout(() => document.body.classList.add("nocursor"), 3000);
    };
    document.addEventListener("mousemove", wakeCursor);
    wakeCursor();

    // Fecha y hora
    const timeFmt = new Intl.DateTimeFormat("es", { hour: "2-digit", minute: "2-digit" });
    const dateFmt = new Intl.DateTimeFormat("es", { weekday: "long", day: "numeric", month: "long" });
    const updClock = () => {
      const now = new Date();
      let txt = timeFmt.format(now);
      if (C.showDate) {
        const d = dateFmt.format(now).replace(",", "");
        txt = d.charAt(0).toUpperCase() + d.slice(1) + " · " + txt;
      }
      clockEl.textContent = txt;
    };
    updClock();
    setInterval(updClock, 1000);

    // Evitar que la pantalla se apague
    let lock = null;
    async function keepAwake() {
      try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) {}
    }
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
    keepAwake();

    if (C.reloadEveryHours > 0) setTimeout(() => { reloadDue = true; }, C.reloadEveryHours * 3600e3);

    // Arranque: primera página directamente visible
    frames[cur].classList.add("on");
    frames[cur].src = buildUrl(pages[idx]);
    beginSlide();
    flashHint(10000);
    setInterval(tick, 200);

    // Para depuración desde la consola
    window.pbiTv = { pages, buildUrl, goTo, togglePause, get index() { return idx; } };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
})();
</script>
</body>
</html>
